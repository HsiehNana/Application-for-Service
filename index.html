<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二苓國小 - 處室勞務申請系統</title>
    <!-- 引入 Tailwind CSS 快速美化介面 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 text-lg">

    <!-- 頁首 -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
            <h1 class="text-3xl font-bold">🏫 高雄市小港區二苓國民小學 - 處室勞務申請系統</h1>
            <button onclick="toggleView()" id="switchBtn" class="bg-emerald-800 hover:bg-emerald-900 px-6 py-3 rounded-xl text-lg font-bold transition shadow">
                切換至後端管理檢視
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">

        <!-- ==================== 前端：填寫申請與處室進度清單 ==================== -->
        <section id="userSection" class="space-y-10">
            <!-- 填寫表單 -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-2xl font-bold text-emerald-700 mb-6 border-b pb-4">📝 填寫新的勞務申請 <span class="text-base text-red-500 font-normal">（所有欄位皆為必填）</span></h2>
                <form id="applyForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- 日期 -->
                        <div>
                            <label class="block text-lg font-bold mb-2 text-slate-700">申請日期 <span class="text-red-500">*</span></label>
                            <input type="date" id="applyDate" required class="w-full border-2 border-slate-300 rounded-xl px-4 py-3.5 text-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <!-- 處室選擇 -->
                        <div>
                            <label class="block text-lg font-bold mb-2 text-slate-700">申請處室 <span class="text-red-500">*</span></label>
                            <select id="applyOffice" required class="w-full border-2 border-slate-300 rounded-xl px-4 py-3.5 text-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                                <option value="">請選擇處室</option>
                                <option value="教務處">教務處</option>
                                <option value="學務處">學務處</option>
                                <option value="輔導室">輔導室</option>
                                <option value="總務處">總務處</option>
                            </select>
                        </div>
                        <!-- 地點填寫 -->
                        <div>
                            <label class="block text-lg font-bold mb-2 text-slate-700">勞務地點 <span class="text-red-500">*</span></label>
                            <input type="text" id="applyLocation" required placeholder="例如：三樓電腦教室、操場" class="w-full border-2 border-slate-300 rounded-xl px-4 py-3.5 text-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                    </div>

                    <!-- 申請內容文字 -->
                    <div>
                        <label class="block text-lg font-bold mb-2 text-slate-700">申請內容說明 <span class="text-red-500">*</span></label>
                        <textarea id="applyContent" rows="4" required placeholder="請詳細描述需要協助的勞務內容..." class="w-full border-2 border-slate-300 rounded-xl px-4 py-3.5 text-lg focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                    </div>

                    <!-- 照片上傳 -->
                    <div>
                        <label class="block text-lg font-bold mb-2 text-slate-700">相關照片（可選）</label>
                        <input type="file" id="applyPhoto" accept="image/*" class="w-full border-2 border-slate-300 rounded-xl px-4 py-3 text-lg file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-base file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl text-xl transition shadow-md">
                        送出申請
                    </button>
                </form>
            </div>

            <!-- 前端：各處室目前申請內容與時間列表 -->
            <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4 gap-4">
                    <h2 class="text-2xl font-bold text-emerald-700">📋 各處室目前申請進度與內容</h2>
                    <!-- 處室篩選按鈕 -->
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="text-slate-700 text-base font-bold mr-1">篩選處室：</span>
                        <button onclick="filterOffice('全部')" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-base font-bold filter-btn shadow" data-office="全部">全部</button>
                        <button onclick="filterOffice('教務處')" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-base font-bold filter-btn" data-office="教務處">教務處</button>
                        <button onclick="filterOffice('學務處')" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-base font-bold filter-btn" data-office="學務處">學務處</button>
                        <button onclick="filterOffice('輔導室')" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-base font-bold filter-btn" data-office="輔導室">輔導室</button>
                        <button onclick="filterOffice('總務處')" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-base font-bold filter-btn" data-office="總務處">總務處</button>
                    </div>
                </div>
                <div id="userRequestList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- 動態帶入 -->
                </div>
            </div>
        </section>

        <!-- ==================== 後端：依填報順序清單與案件管理 ==================== -->
        <section id="adminSection" class="hidden space-y-6">
            <div class="bg-amber-50 border-2 border-amber-200 p-6 rounded-2xl text-amber-900 text-lg flex justify-between items-center shadow-sm">
                <span>🛠️ <strong>後端管理模式：</strong> 依填報順序顯示所有案件，可隨時調整優先順序、狀態並填寫回覆。</span>
                <span id="totalCountBadge" class="bg-amber-200 px-5 py-2 rounded-full font-bold text-base">總案件數：0</span>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-6 bg-slate-100 border-b font-bold text-slate-800 text-xl">
                    📂 勞務申請依序管理清單
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-800 text-base font-bold border-b">
                                <th class="p-5">序號 / 填報時間</th>
                                <th class="p-5">處室 / 地點</th>
                                <th class="p-5">申請內容</th>
                                <th class="p-5">優先順序</th>
                                <th class="p-5">狀態</th>
                                <th class="p-5">回覆與管理</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody" class="divide-y divide-slate-200 text-lg">
                            <!-- 動態帶入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript 邏輯 -->
    <script>
        let requests = JSON.parse(localStorage.getItem('eLingRequests')) || [
            {
                id: 1,
                submitTime: '2026-06-08 10:30', 
                date: '2026-06-10',            
                office: '總務處',
                location: '操場樹木區',
                content: '操場樹木修剪後枝葉清運協助。',
                photo: null,
                priority: '中', 
                status: '處理中', 
                reply: '已排定於本週五進行清運。',
                replyTime: '2026-06-08 14:20' // 新增回覆時間示範
            }
        ];

        let currentFilter = '全部';

        document.getElementById('applyDate').value = new Date().toISOString().split('T')[0];

        function toggleView() {
            const userSec = document.getElementById('userSection');
            const adminSec = document.getElementById('adminSection');
            const btn = document.getElementById('switchBtn');

            if (userSec.classList.contains('hidden')) {
                userSec.classList.remove('hidden');
                adminSec.classList.add('hidden');
                btn.textContent = '切換至後端管理檢視';
                btn.className = 'bg-emerald-800 hover:bg-emerald-900 px-6 py-3 rounded-xl text-lg font-bold transition shadow';
            } else {
                userSec.classList.add('hidden');
                adminSec.classList.remove('hidden');
                btn.textContent = '切換至前端申請檢視';
                btn.className = 'bg-amber-700 hover:bg-amber-800 px-6 py-3 rounded-xl text-lg font-bold transition shadow';
                renderAdminList();
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            const date = document.getElementById('applyDate').value;
            const office = document.getElementById('applyOffice').value;
            const location = document.getElementById('applyLocation').value;
            const content = document.getElementById('applyContent').value;
            const photoInput = document.getElementById('applyPhoto');

            const now = new Date();
            const submitTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveNewRequest(submitTime, date, office, location, content, e.target.result);
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                saveNewRequest(submitTime, date, office, location, content, null);
            }
        }

        function saveNewRequest(submitTime, date, office, location, content, photo) {
            const newReq = {
                id: Date.now(),
                submitTime,
                date,
                office,
                location,
                content,
                photo,
                priority: '中', 
                status: '待處理', 
                reply: '',
                replyTime: ''
            };

            requests.unshift(newReq); 
            syncStorage();
            document.getElementById('applyForm').reset();
            document.getElementById('applyDate').value = new Date().toISOString().split('T')[0];
            alert('勞務申請已成功送出！');
            render();
        }

        function syncStorage() {
            localStorage.setItem('eLingRequests', JSON.stringify(requests));
        }

        function filterOffice(officeName) {
            currentFilter = officeName;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.getAttribute('data-office') === officeName) {
                    btn.className = 'px-4 py-2 bg-emerald-600 text-white rounded-xl text-base font-bold filter-btn shadow';
                } else {
                    btn.className = 'px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-base font-bold filter-btn';
                }
            });
            renderUserList();
        }

        function updateRequest(id) {
            const priority = document.getElementById(`priority-${id}`).value;
            const status = document.getElementById(`status-${id}`).value;
            const reply = document.getElementById(`reply-${id}`).value;

            const req = requests.find(r => r.id === id);
            if (req) {
                req.priority = priority;
                req.status = status;
                req.reply = reply;

                // 若有填寫回覆內容，自動記錄當前回覆時間；若清空回覆則同時清空回覆時間
                if (reply.trim() !== '') {
                    const now = new Date();
                    req.replyTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                } else {
                    req.replyTime = '';
                }

                syncStorage();
                alert('案件回覆與狀態更新成功！');
                render();
            }
        }

        function deleteRequest(id) {
            if(confirm('確定要刪除此筆申請紀錄嗎？')) {
                requests = requests.filter(r => r.id !== id);
                syncStorage();
                render();
            }
        }

        function render() {
            renderUserList();
            renderAdminList();
        }

        function renderUserList() {
            const container = document.getElementById('userRequestList');
            
            let filtered = requests;
            if (currentFilter !== '全部') {
                filtered = requests.filter(r => r.office === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-center col-span-2 py-12 text-xl">目前沒有符合條件的申請紀錄。</p>`;
                return;
            }

            container.innerHTML = filtered.map(req => {
                let badgeColor = 'bg-yellow-100 text-yellow-800';
                if (req.status === '處理中') badgeColor = 'bg-blue-100 text-blue-800';
                if (req.status === '已完成') badgeColor = 'bg-green-100 text-green-800';

                return `
                    <div class="border-2 border-slate-200 rounded-2xl p-6 space-y-4 bg-white shadow-sm flex flex-col justify-between">
                        <div class="space-y-3">
                            <div class="flex justify-between items-start">
                                <div>
                                    <span class="bg-emerald-100 text-emerald-800 text-base font-bold px-3.5 py-1.5 rounded-xl">${req.office}</span>
                                    <span class="text-base text-slate-700 ml-2 font-bold">📍 ${req.location}</span>
                                </div>
                                <span class="text-base px-3.5 py-1.5 rounded-xl font-bold ${badgeColor}">${req.status}</span>
                            </div>
                            <div class="text-base text-slate-500 flex justify-between font-semibold">
                                <span>填報時間：${req.submitTime}</span>
                                <span class="text-emerald-700 font-bold">需求日期：${req.date}</span>
                            </div>
                            <p class="text-slate-900 text-lg whitespace-pre-line bg-slate-50 p-4 rounded-xl border border-slate-200 leading-relaxed font-medium">${req.content}</p>
                            ${req.photo ? `<div><img src="${req.photo}" class="w-36 h-36 object-cover rounded-xl border-2 shadow-sm"></div>` : ''}
                        </div>
                        
                        <!-- 回覆顯示區 (含回覆時間) -->
                        <div class="bg-emerald-50 p-5 rounded-xl border-2 border-emerald-200 text-lg mt-2 space-y-2">
                            <div class="flex justify-between items-center">
                                <strong class="text-emerald-900 text-base font-bold">📢 處室回覆結果：</strong>
                                <span class="text-xs text-slate-500 font-semibold">${req.replyTime ? '回覆時間：' + req.replyTime : ''}</span>
                            </div>
                            <p class="text-slate-900 leading-relaxed font-medium">${req.reply ? req.reply : '<span class="text-slate-400 italic">尚在處理中，暫無回覆...</span>'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderAdminList() {
            const tbody = document.getElementById('adminTableBody');
            document.getElementById('totalCountBadge').textContent = `總案件數：${requests.length}`;

            if (requests.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-slate-400 text-xl">目前沒有任何申請案件。</td></tr>`;
                return;
            }

            tbody.innerHTML = requests.map((req, index) => `
                <tr class="hover:bg-slate-50 transition align-top">
                    <td class="p-5 text-base text-slate-600 whitespace-nowrap">
                        <div class="font-bold text-slate-900 text-lg">#${requests.length - index}</div>
                        <div class="mt-1 font-medium">${req.submitTime}</div>
                        <div class="text-emerald-700 mt-1 font-bold">需用：${req.date}</div>
                    </td>
                    <td class="p-5 whitespace-nowrap">
                        <span class="bg-amber-100 text-amber-900 text-base font-bold px-3 py-1 rounded-xl block w-max mb-2">${req.office}</span>
                        <span class="text-base text-slate-800 block font-bold">📍 ${req.location}</span>
                    </td>
                    <td class="p-5 max-w-sm">
                        <p class="text-slate-900 text-lg leading-relaxed font-medium">${req.content}</p>
                        ${req.photo ? `<img src="${req.photo}" class="w-24 h-24 object-cover rounded-xl mt-3 border-2 shadow-sm">` : ''}
                    </td>
                    <td class="p-5">
                        <select id="priority-${req.id}" class="border-2 border-slate-300 rounded-xl px-3.5 py-2.5 text-lg font-bold outline-none focus:ring-1 focus:ring-amber-500 bg-white">
                            <option value="高" ${req.priority === '高' ? 'selected' : ''}>高</option>
                            <option value="中" ${req.priority === '中' ? 'selected' : ''}>中</option>
                            <option value="低" ${req.priority === '低' ? 'selected' : ''}>低</option>
                        </select>
                    </td>
                    <td class="p-5">
                        <select id="status-${req.id}" class="border-2 border-slate-300 rounded-xl px-3.5 py-2.5 text-lg font-bold outline-none focus:ring-1 focus:ring-amber-500 bg-white">
                            <option value="待處理" ${req.status === '待處理' ? 'selected' : ''}>待處理</option>
                            <option value="處理中" ${req.status === '處理中' ? 'selected' : ''}>處理中</option>
                            <option value="已完成" ${req.status === '已完成' ? 'selected' : ''}>已完成</option>
                        </select>
                    </td>
                    <td class="p-5 space-y-3 min-w-[260px]">
                        <textarea id="reply-${req.id}" rows="2" class="w-full border-2 border-slate-300 rounded-xl px-3.5 py-2.5 text-lg outline-none focus:ring-1 focus:ring-amber-500 font-medium" placeholder="輸入回覆結果...">${req.reply || ''}</textarea>
                        
                        <!-- 顯示上次回覆時間提示 -->
                        <div class="text-xs text-slate-500 font-semibold">
                            ${req.replyTime ? '上次回覆：' + req.replyTime : '尚未回覆'}
                        </div>

                        <div class="flex justify-between items-center">
                            <button onclick="updateRequest(${req.id})" class="bg-amber-600 hover:bg-amber-700 text-white text-base font-bold px-5 py-2.5 rounded-xl transition shadow">
                                儲存回覆
                            </button>
                            <button onclick="deleteRequest(${req.id})" class="text-red-600 hover:text-red-800 text-base font-bold">
                                刪除
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        render();
    </script>
</body>
</html>
