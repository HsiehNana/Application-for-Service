<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二苓國小 - 處室勞務申請系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 text-sm md:text-base">

    <!-- 頁首 -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <h1 class="text-lg sm:text-2xl font-bold text-center sm:text-left">🏫 高雄市小港區二苓國民小學<br class="sm:hidden"> 處室勞務申請系統</h1>
            <button onclick="checkAdminPassword()" id="switchBtn" class="bg-emerald-800 hover:bg-emerald-900 px-4 py-2 rounded-xl text-sm sm:text-base font-bold transition shadow whitespace-nowrap">
                切換至後端管理檢視
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">

        <!-- ==================== 前端：填寫申請與處室進度清單 ==================== -->
        <section id="userSection" class="space-y-6 sm:space-y-8">
            <!-- 填寫表單 -->
            <div class="bg-white p-5 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-base sm:text-xl font-bold text-emerald-700 mb-4 sm:mb-6 border-b pb-3 flex flex-wrap justify-between items-center gap-2">
                    <span>📝 填寫新的勞務申請</span>
                    <span class="text-xs sm:text-sm text-red-500 font-normal">（所有欄位皆為必填）</span>
                </h2>
                <form id="applyForm" onsubmit="handleFormSubmit(event)" class="space-y-4 sm:space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 sm:gap-6">
                        <!-- 日期 -->
                        <div>
                            <label class="block text-sm sm:text-base font-bold mb-1.5 text-slate-700">申請日期 <span class="text-red-500">*</span></label>
                            <input type="date" id="applyDate" required class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm sm:text-base focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                        <!-- 處室選擇 -->
                        <div>
                            <label class="block text-sm sm:text-base font-bold mb-1.5 text-slate-700">申請處室 <span class="text-red-500">*</span></label>
                            <select id="applyOffice" required class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm sm:text-base focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                                <option value="">請選擇處室</option>
                                <option value="校長室">校長室</option>
                                <option value="教務處">教務處</option>
                                <option value="學務處">學務處</option>
                                <option value="輔導室">輔導室</option>
                                <option value="總務處">總務處</option>
                            </select>
                        </div>
                        <!-- 地點填寫 -->
                        <div class="sm:col-span-2 md:col-span-1">
                            <label class="block text-sm sm:text-base font-bold mb-1.5 text-slate-700">勞務地點 <span class="text-red-500">*</span></label>
                            <input type="text" id="applyLocation" required placeholder="例如：三樓電腦教室" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm sm:text-base focus:ring-2 focus:ring-emerald-500 outline-none">
                        </div>
                    </div>

                    <!-- 申請內容文字 -->
                    <div>
                        <label class="block text-sm sm:text-base font-bold mb-1.5 text-slate-700">申請內容說明 <span class="text-red-500">*</span></label>
                        <textarea id="applyContent" rows="3" required placeholder="請詳細描述需要協助的勞務內容..." class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm sm:text-base focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                    </div>

                    <!-- 照片上傳 -->
                    <div>
                        <label class="block text-sm sm:text-base font-bold mb-1.5 text-slate-700">相關照片（可選）</label>
                        <input type="file" id="applyPhoto" accept="image/*" class="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm sm:text-base file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs sm:file:text-sm file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-base sm:text-lg transition shadow-md">
                        送出申請
                    </button>
                </form>
            </div>

            <!-- 前端：各處室目前申請內容與時間列表 -->
            <div class="bg-white p-5 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4 gap-4">
                    <h2 class="text-base sm:text-xl font-bold text-emerald-700">📋 各處室目前申請進度與內容</h2>
                    <!-- 處室篩選按鈕 -->
                    <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 w-full md:w-auto">
                        <span class="text-slate-600 text-xs sm:text-sm font-bold mr-1">篩選：</span>
                        <button onclick="filterOffice('全部')" class="px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs sm:text-sm font-bold filter-btn shadow-sm" data-office="全部">全部</button>
                        <button onclick="filterOffice('校長室')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-xs sm:text-sm font-bold filter-btn" data-office="校長室">校長室</button>
                        <button onclick="filterOffice('教務處')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-xs sm:text-sm font-bold filter-btn" data-office="教務處">教務處</button>
                        <button onclick="filterOffice('學務處')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-xs sm:text-sm font-bold filter-btn" data-office="學務處">學務處</button>
                        <button onclick="filterOffice('輔導室')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-xs sm:text-sm font-bold filter-btn" data-office="輔導室">輔導室</button>
                        <button onclick="filterOffice('總務處')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-xs sm:text-sm font-bold filter-btn" data-office="總務處">總務處</button>
                    </div>
                </div>
                <div id="userRequestList" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                    <!-- 動態帶入 -->
                </div>
            </div>
        </section>

        <!-- ==================== 後端：依填報順序清單與案件管理 ==================== -->
        <section id="adminSection" class="hidden space-y-6">
            <div class="bg-amber-50 border border-amber-200 p-4 sm:p-5 rounded-2xl text-amber-900 text-sm sm:text-base flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-sm">
                <span>🛠️ <strong>後端管理模式：</strong> 依填報順序顯示所有案件，可勾選多位回覆人員、調整優先順序、狀態與回覆。</span>
                <span id="totalCountBadge" class="bg-amber-200 px-3 py-1 rounded-full font-bold text-xs sm:text-sm whitespace-nowrap">總案件數：0</span>
            </div>

            <!-- 電腦版表格檢視 (隱藏於小螢幕) -->
            <div class="hidden md:block bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-5 bg-slate-100 border-b font-bold text-slate-800 text-base sm:text-lg flex justify-between items-center">
                    <span>📂 勞務申請依序管理清單</span>
                    <button onclick="returnToUserView()" class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-bold">
                        返回前端申請畫面
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-800 text-xs sm:text-sm font-bold border-b">
                                <th class="p-4">序號 / 時間</th>
                                <th class="p-4">處室 / 地點</th>
                                <th class="p-4">申請內容</th>
                                <th class="p-4">優先順序</th>
                                <th class="p-4">狀態</th>
                                <th class="p-4 min-w-[280px]">回覆與管理</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody" class="divide-y divide-slate-200 text-sm sm:text-base">
                            <!-- 動態帶入 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 手機版卡片管理檢視 (隱藏於電腦螢幕) -->
            <div class="md:hidden space-y-4">
                <div class="flex justify-between items-center bg-white p-4 rounded-xl border shadow-sm">
                    <span class="font-bold text-slate-800">📂 手機後台管理清單</span>
                    <button onclick="returnToUserView()" class="bg-slate-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">
                        返回前端
                    </button>
                </div>
                <div id="adminCardList" class="space-y-4">
                    <!-- 動態帶入 -->
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript 邏輯 -->
    <script>
        const availableRepliers = ['凃總', '邱帥', '沈帥', '侯大', '楊大'];

        let requests = JSON.parse(localStorage.getItem('eLingRequests')) || [
            {
                id: 1,
                submitTime: '2026-06-08 10:30', 
                date: '2026-06-10',            
                office: '總務處',
                location: '操場樹木區',
                content: '操場樹木修剪後枝葉清運協助。',
                photo: null,
                priority: '中', 
                status: '處理中', 
                reply: '已排定於本週五進行清運。',
                replyTime: '2026-06-08 14:20',
                repliers: ['凃總', '邱帥']
            }
        ];

        let currentFilter = '全部';
        let isAdminLoggedIn = false;

        document.getElementById('applyDate').value = new Date().toISOString().split('T')[0];

        // 檢查後台密碼 (設為 311)
        function checkAdminPassword() {
            if (isAdminLoggedIn) {
                toggleView();
                return;
            }

            const inputPassword = prompt('請輸入後端管理密碼：');
            if (inputPassword === '311') {
                isAdminLoggedIn = true;
                toggleView();
            } else if (inputPassword !== null) {
                alert('密碼錯誤，無法進入後台！');
            }
        }

        // 切換 前端/後端 檢視
        function toggleView() {
            const userSec = document.getElementById('userSection');
            const adminSec = document.getElementById('adminSection');
            const btn = document.getElementById('switchBtn');

            if (userSec.classList.contains('hidden')) {
                userSec.classList.remove('hidden');
                adminSec.classList.add('hidden');
                btn.textContent = '切換至後端管理檢視';
                btn.className = 'bg-emerald-800 hover:bg-emerald-900 px-4 py-2 rounded-xl text-sm sm:text-base font-bold transition shadow';
            } else {
                userSec.classList.add('hidden');
                adminSec.classList.remove('hidden');
                btn.textContent = '目前在後端管理模式';
                btn.className = 'bg-amber-700 text-white px-4 py-2 rounded-xl text-sm sm:text-base font-bold shadow cursor-default';
                renderAdminList();
            }
        }

        function returnToUserView() {
            const userSec = document.getElementById('userSection');
            const adminSec = document.getElementById('adminSection');
            const btn = document.getElementById('switchBtn');

            userSec.classList.remove('hidden');
            adminSec.classList.add('hidden');
            btn.textContent = '切換至後端管理檢視';
            btn.className = 'bg-emerald-800 hover:bg-emerald-900 px-4 py-2 rounded-xl text-sm sm:text-base font-bold transition shadow';
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            const date = document.getElementById('applyDate').value;
            const office = document.getElementById('applyOffice').value;
            const location = document.getElementById('applyLocation').value;
            const content = document.getElementById('applyContent').value;
            const photoInput = document.getElementById('applyPhoto');

            const now = new Date();
            const submitTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveNewRequest(submitTime, date, office, location, content, e.target.result);
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                saveNewRequest(submitTime, date, office, location, content, null);
            }
        }

        function saveNewRequest(submitTime, date, office, location, content, photo) {
            const newReq = {
                id: Date.now(),
                submitTime,
                date,
                office,
                location,
                content,
                photo,
                priority: '中', 
                status: '待處理', 
                reply: '',
                replyTime: '',
                repliers: []
            };

            requests.unshift(newReq); 
            syncStorage();
            document.getElementById('applyForm').reset();
            document.getElementById('applyDate').value = new Date().toISOString().split('T')[0];
            alert('勞務申請已成功送出！');
            render();
        }

        function syncStorage() {
            localStorage.setItem('eLingRequests', JSON.stringify(requests));
        }

        function filterOffice(officeName) {
            currentFilter = officeName;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.getAttribute('data-office') === officeName) {
                    btn.className = 'px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs sm:text-sm font-bold filter-btn shadow-sm';
                } else {
                    btn.className = 'px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg text-xs sm:text-sm font-bold filter-btn';
                }
            });
            renderUserList();
        }

        function updateRequest(id) {
            const priority = document.getElementById(`priority-${id}`).value;
            const status = document.getElementById(`status-${id}`).value;
            const reply = document.getElementById(`reply-${id}`).value;

            const checkboxes = document.querySelectorAll(`.replier-checkbox-${id}:checked`);
            const repliers = Array.from(checkboxes).map(cb => cb.value);

            const req = requests.find(r => r.id === id);
            if (req) {
                req.priority = priority;
                req.status = status;
                req.repliers = repliers;
                req.reply = reply;

                if (reply.trim() !== '') {
                    const now = new Date();
                    req.replyTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                } else {
                    req.replyTime = '';
                    req.repliers = [];
                }

                syncStorage();
                alert('案件回覆與狀態更新成功！');
                render();
            }
        }

        function deleteRequest(id) {
            if(confirm('確定要刪除此筆申請紀錄嗎？')) {
                requests = requests.filter(r => r.id !== id);
                syncStorage();
                render();
            }
        }

        function render() {
            renderUserList();
            renderAdminList();
        }

        function renderUserList() {
            const container = document.getElementById('userRequestList');
            
            let filtered = requests;
            if (currentFilter !== '全部') {
                filtered = requests.filter(r => r.office === currentFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-center col-span-2 py-10 text-base sm:text-lg">目前沒有符合條件的申請紀錄。</p>`;
                return;
            }

            container.innerHTML = filtered.map(req => {
                let badgeColor = 'bg-yellow-100 text-yellow-800';
                if (req.status === '處理中') badgeColor = 'bg-blue-100 text-blue-800';
                if (req.status === '已完成') badgeColor = 'bg-green-100 text-green-800';

                const replierText = req.repliers && req.repliers.length > 0 ? req.repliers.join('、') + ' 處室回覆' : '處室回覆結果';

                return `
                    <div class="border border-slate-200 rounded-2xl p-5 sm:p-6 space-y-3.5 bg-white shadow-sm flex flex-col justify-between">
                        <div class="space-y-2.5">
                            <div class="flex justify-between items-start gap-2">
                                <div>
                                    <span class="bg-emerald-100 text-emerald-800 text-xs sm:text-sm font-bold px-3 py-1 rounded-lg">${req.office}</span>
                                    <span class="text-xs sm:text-sm text-slate-700 ml-1.5 font-bold">📍 ${req.location}</span>
                                </div>
                                <span class="text-xs sm:text-sm px-2.5 py-1 rounded-lg font-bold whitespace-nowrap ${badgeColor}">${req.status}</span>
                            </div>
                            <div class="text-xs sm:text-sm text-slate-500 flex flex-wrap justify-between gap-1 font-semibold">
                                <span>填報：${req.submitTime}</span>
                                <span class="text-emerald-700 font-bold">需用：${req.date}</span>
                            </div>
                            <p class="text-slate-900 text-sm sm:text-base whitespace-pre-line bg-slate-50 p-3.5 rounded-xl border border-slate-200 leading-relaxed font-medium">${req.content}</p>
                            ${req.photo ? `<div><img src="${req.photo}" class="w-32 h-32 object-cover rounded-xl border shadow-sm"></div>` : ''}
                        </div>
                        
                        <!-- 回覆顯示區 -->
                        <div class="bg-emerald-50/80 p-4 rounded-xl border border-emerald-200 text-sm sm:text-base mt-2 space-y-1.5">
                            <div class="flex flex-wrap justify-between items-center gap-1">
                                <strong class="text-emerald-900 text-xs sm:text-sm font-bold">📢 ${replierText}：</strong>
                                <span class="text-[11px] sm:text-xs text-slate-500 font-semibold">${req.replyTime ? '回覆時間：' + req.replyTime : ''}</span>
                            </div>
                            <p class="text-slate-900 leading-relaxed font-medium">${req.reply ? req.reply : '<span class="text-slate-400 italic">尚在處理中，暫無回覆...</span>'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderAdminList() {
            const tbody = document.getElementById('adminTableBody');
            document.getElementById('totalCountBadge').textContent = `總案件數：${requests.length}`;

            if (requests.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-slate-400 text-base">目前沒有任何申請案件。</td></tr>`;
                document.getElementById('adminCardList').innerHTML = `<p class="text-center py-10 text-slate-400">目前沒有任何申請案件。</p>`;
                return;
            }

            tbody.innerHTML = requests.map((req, index) => {
                let replierCheckboxes = availableRepliers.map(name => {
                    const isChecked = req.repliers && req.repliers.includes(name) ? 'checked' : '';
                    return `<label class="inline-flex items-center space-x-1 cursor-pointer bg-white px-2 py-1 rounded border border-slate-200 text-xs font-bold">
                        <input type="checkbox" value="${name}" ${isChecked} class="replier-checkbox-${req.id} rounded text-amber-600 focus:ring-amber-500">
                        <span>${name}</span>
                    </label>`;
                }).join('');

                return `
                    <tr class="hover:bg-slate-50 transition align-top">
                        <td class="p-4 text-xs sm:text-sm text-slate-600 whitespace-nowrap">
                            <div class="font-bold text-slate-900 text-base">#${requests.length - index}</div>
                            <div class="mt-1 font-medium">${req.submitTime}</div>
                            <div class="text-emerald-700 mt-1 font-bold">需用：${req.date}</div>
                        </td>
                        <td class="p-4 whitespace-nowrap">
                            <span class="bg-amber-100 text-amber-900 text-xs font-bold px-2.5 py-1 rounded-lg block w-max mb-1.5">${req.office}</span>
                            <span class="text-xs sm:text-sm text-slate-800 block font-bold">📍 ${req.location}</span>
                        </td>
                        <td class="p-4 max-w-xs">
                            <p class="text-slate-900 text-sm sm:text-base leading-relaxed font-medium">${req.content}</p>
                            ${req.photo ? `<img src="${req.photo}" class="w-20 h-20 object-cover rounded-xl mt-2 border shadow-sm">` : ''}
                        </td>
                        <td class="p-4">
                            <select id="priority-${req.id}" class="border border-slate-300 rounded-xl px-2 py-1.5 text-xs sm:text-sm font-bold outline-none bg-white">
                                <option value="高" ${req.priority === '高' ? 'selected' : ''}>高</option>
                                <option value="中" ${req.priority === '中' ? 'selected' : ''}>中</option>
                                <option value="低" ${req.priority === '低' ? 'selected' : ''}>低</option>
                            </select>
                        </td>
                        <td class="p-4">
                            <select id="status-${req.id}" class="border border-slate-300 rounded-xl px-2 py-1.5 text-xs sm:text-sm font-bold outline-none bg-white">
                                <option value="待處理" ${req.status === '待處理' ? 'selected' : ''}>待處理</option>
                                <option value="處理中" ${req.status === '處理中' ? 'selected' : ''}>處理中</option>
                                <option value="已完成" ${req.status === '已完成' ? 'selected' : ''}>已完成</option>
                            </select>
                        </td>
                        <td class="p-4 space-y-2.5">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">回覆人員 (可複選)</label>
                                <div class="flex flex-wrap gap-1.5">${replierCheckboxes}</div>
                            </div>

                            <div>
                                <textarea id="reply-${req.id}" rows="2" class="w-full border border-slate-300 rounded-xl p-2 text-xs sm:text-sm outline-none font-medium" placeholder="輸入回覆結果...">${req.reply || ''}</textarea>
                            </div>
                            
                            <div class="text-[11px] text-slate-500 font-semibold">
                                ${req.replyTime ? '上次回覆：' + req.replyTime : '尚未回覆'}
                            </div>

                            <div class="flex justify-between items-center pt-1">
                                <button onclick="updateRequest(${req.id})" class="bg-amber-600 hover:bg-amber-700 text-white text-xs sm:text-sm font-bold px-4 py-1.5 rounded-xl transition shadow">
                                    儲存回覆
                                </button>
                                <button onclick="deleteRequest(${req.id})" class="text-red-600 hover:text-red-800 text-xs font-bold">
                                    刪除
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            const cardContainer = document.getElementById('adminCardList');
            cardContainer.innerHTML = requests.map((req, index) => {
                let replierCheckboxesMobile = availableRepliers.map(name => {
                    const isChecked = req.repliers && req.repliers.includes(name) ? 'checked' : '';
                    return `<label class="inline-flex items-center space-x-1 bg-white px-2 py-1 rounded border text-xs font-bold">
                        <input type="checkbox" value="${name}" ${isChecked} class="replier-checkbox-${req.id} rounded text-amber-600">
                        <span>${name}</span>
                    </label>`;
                }).join('');

                return `
                    <div class="bg-white border rounded-2xl p-4 space-y-3 shadow-sm">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-800">#${requests.length - index} [${req.office}]</span>
                            <span class="text-xs text-slate-500">${req.submitTime}</span>
                        </div>
                        <div class="text-xs text-slate-600 font-bold">📍 地點：${req.location} | 需用：${req.date}</div>
                        <p class="text-sm bg-slate-50 p-2.5 rounded-lg">${req.content}</p>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-1">優先順序</label>
                                <select id="priority-${req.id}" class="w-full border rounded-lg p-1.5 text-xs font-bold bg-white">
                                    <option value="高" ${req.priority === '高' ? 'selected' : ''}>高</option>
                                    <option value="中" ${req.priority === '中' ? 'selected' : ''}>中</option>
                                    <option value="低" ${req.priority === '低' ? 'selected' : ''}>低</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-slate-500 mb-1">處理狀態</label>
                                <select id="status-${req.id}" class="w-full border rounded-lg p-1.5 text-xs font-bold bg-white">
                                    <option value="待處理" ${req.status === '待處理' ? 'selected' : ''}>待處理</option>
                                    <option value="處理中" ${req.status === '處理中' ? 'selected' : ''}>處理中</option>
                                    <option value="已完成" ${req.status === '已完成' ? 'selected' : ''}>已完成</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 mb-1">回覆人員 (可複選)</label>
                            <div class="flex flex-wrap gap-1">${replierCheckboxesMobile}</div>
                        </div>

                        <div>
                            <textarea id="reply-${req.id}" rows="2" class="w-full border rounded-lg p-2 text-xs" placeholder="輸入回覆結果...">${req.reply || ''}</textarea>
                        </div>

                        <div class="text-[11px] text-slate-500">
                            ${req.replyTime ? '上次回覆：' + req.replyTime : '尚未回覆'}
                        </div>

                        <div class="flex justify-between items-center pt-2 border-t">
                            <button onclick="updateRequest(${req.id})" class="bg-amber-600 text-white text-xs font-bold px-4 py-2 rounded-lg">
                                儲存回覆
                            </button>
                            <button onclick="deleteRequest(${req.id})" class="text-red-600 text-xs font-bold">
                                刪除
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        render();
    </script>
</body>
</html>
